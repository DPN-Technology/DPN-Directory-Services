name: DPN DS | Quality & Security Gates

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python API | unit tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API and tooling
        run: python -m pip install -e "./backend[dev]"
      - name: Validate lint
        run: ruff check backend
      - name: Run tests
        run: python -m pytest backend/tests -q

  console:
    name: Console | TypeScript + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend
        run: npm install --no-fund
      - name: Typecheck and bundle
        run: npm run build

  dependencies:
    name: Supply chain | dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit Python runtime requirements
        run: |
          python -m pip install -e ./backend pip-audit
          python -m pip_audit
      - name: Audit production JavaScript dependencies
        working-directory: frontend
        run: |
          npm install --no-fund
          npm audit --omit=dev --audit-level=high
