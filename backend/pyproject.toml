[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dpn-directory-services"
version = "0.1.0"
description = "Read-only Samba AD domain operations API for DPN Directory Services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "dnspython>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpn_ds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
